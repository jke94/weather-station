name: Morning daily scheduler yesterday post in Facebook at 09h UTC

on:
  schedule:
    - cron: '30 07 * 3-10 *'      # 09:30 CEST (march-october) -> 07:30 UTC
    - cron: '30 08 * 11,12,1,2 *' # 09:30 CET  (november-february) -> 08:30 UTC
  workflow_dispatch:
    inputs:
      retry_unresolved_publication:
        description: Retry only after confirming the prior attempt did not post
        type: boolean
        required: false
        default: false

jobs:
  fetch_weather:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: publish-weather-facebook
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m test.run_unit_tests

      - name: Restore publication state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ./src/utils/restore_publishing_state.py --platform facebook

      - name: Run morning daily scheduler post in Facebook script.
        env:
            WEATHER_UNDERGROUND_STATION_ID: ${{ secrets.WEATHER_UNDERGROUND_STATION_ID }}
            WEATHER_UNDERGROUND_API_KEY: ${{ secrets.WEATHER_UNDERGROUND_API_KEY }}
            FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
            FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
            WEATHER_PUBLISHING_STATE_PATH: .weather_station/publishing-state.json
            RETRY_UNRESOLVED_PUBLICATION: ${{ inputs.retry_unresolved_publication }}
            PYTHONPATH: src
        run: |
          args=()
          if [ "$RETRY_UNRESOLVED_PUBLICATION" = "true" ]; then
            args+=(--retry-unresolved-publication)
          fi
          python -m weather_station.post_morning_daily_post_in_facebook "${args[@]}"

      - name: Save publication state
        if: ${{ always() && hashFiles('.weather_station/publishing-state.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weather-station-state-facebook
          path: .weather_station/publishing-state.json
          include-hidden-files: true
          retention-days: 90
