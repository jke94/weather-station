name: On push master morning_daily_scheduler_on_x.py

on:
    push:
      branches:
        - master

jobs:
  fetch_weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.12'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run Unit Tests
        run: python -m test.run_unit_tests

      - name: Run Script
        env:
            WEATHER_UNDERGROUND_STATION_ID: ${{ secrets.WEATHER_UNDERGROUND_STATION_ID }}
            WEATHER_UNDERGROUND_API_KEY: ${{ secrets.WEATHER_UNDERGROUND_API_KEY }}
            PYTHONPATH: src
        run: python -m weather_station.morning_daily_scheduler_on_x